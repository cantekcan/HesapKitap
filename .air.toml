# Komutlar Taskfile.yml'de (task dev) verilir; burada sadece izleme ayarları var.
root = "."
tmp_dir = "tmp"

[build]
  include_ext = ["go", "css", "js", "sql"]
  exclude_dir = ["tmp", "tools", "bin", ".git", ".github", "docs", "logs"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
