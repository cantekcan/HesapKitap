# Canlı yığın: uygulama + PostgreSQL + Caddy (otomatik HTTPS).
# Kullanım ve kurulum adımları: docs/DEPLOY.md
#   cp .env.prod.example .env.prod   (doldur; repoya girmez)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hesapkitap
      POSTGRES_USER: hesapkitap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesapkitap -d hesapkitap"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Dışarıya port açılmaz; yalnızca iç ağdan app bağlanır.

  # Her güncellemede şema migration'larını uygular, sonra kapanır.
  migrate:
    build: .
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://hesapkitap:${POSTGRES_PASSWORD}@db:5432/hesapkitap?sslmode=disable
      TRENDYOL_BASE_URL: ${TRENDYOL_BASE_URL:?TRENDYOL_BASE_URL zorunlu}
      TRENDYOL_EMAIL: ${TRENDYOL_EMAIL:?TRENDYOL_EMAIL zorunlu}
      TRENDYOL_PASSWORD: ${TRENDYOL_PASSWORD:?TRENDYOL_PASSWORD zorunlu}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://hesapkitap:${POSTGRES_PASSWORD}@db:5432/hesapkitap?sslmode=disable
      TRENDYOL_BASE_URL: ${TRENDYOL_BASE_URL:?TRENDYOL_BASE_URL zorunlu}
      TRENDYOL_EMAIL: ${TRENDYOL_EMAIL:?TRENDYOL_EMAIL zorunlu}
      TRENDYOL_PASSWORD: ${TRENDYOL_PASSWORD:?TRENDYOL_PASSWORD zorunlu}
      EINVOICE_ENABLED: ${EINVOICE_ENABLED:-false}
      EINVOICE_SCENARIO: ${EINVOICE_SCENARIO:-TEMELFATURA}
      INVOICE_PREFIX: ${INVOICE_PREFIX:-}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS (alan adı) zorunlu}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
