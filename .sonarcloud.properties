# SonarCloud otomatik analizi bu dosyayı okur.
# Üretilen kod (templ, sqlc), derleme çıktısı ve statik dosyalar analiz dışı; test dosyaları tekrar analizi dışı.
sonar.exclusions=**/*_templ.go,**/dbgen/**,internal/platform/http/static/**,tmp/**,bin/**
sonar.cpd.exclusions=**/*_templ.go,**/dbgen/**,**/*_test.go
