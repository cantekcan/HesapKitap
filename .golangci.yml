version: "2"

run:
  timeout: 5m
  # stage testleri de lint'ten geçsin (çalıştırılmaz, sadece derlenir/incelenir)
  build-tags: [stage]

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errname
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    misspell:
      # Türkçe kullanıcı metinleri İngilizce yazım sözlüğüne takılmasın
      ignore-rules:
        - adres
        - Adres
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: panic kullanma; hatayı %w ile sar ve dön
  exclusions:
    # "Code generated" başlıklı dosyalar (templ, sqlc) varsayılan olarak hariç tutulur.
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
