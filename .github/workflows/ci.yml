name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Araçları kur
        run: task tools

      - name: Üretilen kod güncel mi?
        run: |
          task gen
          git diff --exit-code || (echo "::error::Üretilen kod güncel değil: 'task gen' çalıştırıp commit'leyin" && exit 1)

      - name: Lint
        run: task lint

      - name: Test (Docker'lı runner'da Postgres entegrasyon testleri de çalışır)
        run: task test

      - name: Build
        run: task build
