name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Araçları kur
        run: task tools

      - name: Üretilen kod güncel mi?
        run: |
          task gen
          git diff --exit-code || (echo "::error::Üretilen kod güncel değil: 'task gen' çalıştırıp commit'leyin" && exit 1)

      - name: Lint
        run: task lint

      - name: Test (Docker'lı runner'da Postgres entegrasyon testleri de çalışır)
        run: task test

      - name: Build
        run: task build
